name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-checks:
    name: macos-checks
    # SSH Match command requires OpenSSH 10.0+ from the system client.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install stow gitleaks tmux zoxide direnv fzf fd ripgrep ruff prettier
      - run: gitleaks git --redact --verbose --log-opts="--all"
      - run: zsh tests/prepare-ci.zsh "$RUNNER_TEMP/dotfiles-home"
      - run: |
          export HOME="$RUNNER_TEMP/dotfiles-home"
          export ZDOTDIR="$HOME"
          /usr/bin/ssh -V
          zsh tests/check.zsh --ci
