name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-checks:
    name: macos-checks
    # SSH Match command requires OpenSSH 10.0+ from the system client.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: brew install stow gitleaks tmux zoxide direnv fzf fd ripgrep ruff prettier clang-format markdownlint-cli
      - run: gitleaks git --redact --verbose --log-opts="--all"
      - run: zsh tests/prepare-ci.zsh "$RUNNER_TEMP/dotfiles-home"
      - run: |
          export HOME="$RUNNER_TEMP/dotfiles-home"
          export ZDOTDIR="$HOME"
          /usr/bin/ssh -V
          zsh tests/check.zsh --ci
