name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos-checks:
    name: macos-checks
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install stow gitleaks tmux
      - run: gitleaks git --redact --verbose --log-opts="--all"
      - run: zsh tests/check.zsh --all
